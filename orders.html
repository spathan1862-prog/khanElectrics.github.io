<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Khan Services</title>
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="description" content="Track and view your past orders at Khan Services.">
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-card: #f9fafb;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --primary: #000000;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text);
            line-height: 1.5;
        }
        * { box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        header { padding: 24px 0; border-bottom: 1px solid var(--border); text-align: center; margin-bottom: 40px; }
        header a { font-size: 1.5rem; font-weight: 700; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        
        h1, h2, h3, h4 { margin-top: 0; margin-bottom: 0.5rem; color: var(--text); font-weight: 600; }
        .page-title { font-size: 2.2rem; margin-bottom: 8px; text-align: center; }
        .page-subtitle { color: var(--text-muted); text-align: center; margin-bottom: 40px; font-size: 1.1rem; }
        
        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: 0.2s; }
        .btn-primary:hover { background: #333; }

        .orders-list { display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
        .order-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .order-card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .order-card-id { font-family: monospace; font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .order-card-date { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .order-status-badge { padding: 6px 14px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-confirmed { background: #dbeafe; color: #2563eb; }
        .status-delivered { background: #dcfce3; color: #16a34a; }
        .status-cancelled { background: #fee2e2; color: #dc2626; }
        
        .order-items-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .order-line-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        .order-line-item:last-child { border-bottom: none; }
        
        .order-total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); font-weight: 700; font-size: 1.1rem; }
        .order-address { background: #ffffff; padding: 16px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; border: 1px solid var(--border); margin-top: 16px; color: var(--text-muted); }
        .order-address strong { color: var(--text); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        #auth-modal { display: none !important; }
    </style>
</head>

<body>

    <header>
        <a href="index.html">
            <i data-lucide="zap"></i> Khan Services
        </a>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">My Orders</h1>
                <p class="page-subtitle">Track and view your past orders.</p>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">

                <!-- Not logged in -->
                <div id="orders-login-prompt" style="display:none; text-align:center; padding:60px 20px;">
                    <div style="max-width:480px; margin:0 auto;">
                        <i data-lucide="lock" style="width:64px;height:64px;color:var(--text-muted);margin-bottom:24px;opacity:0.4;"></i>
                        <h3 style="margin-bottom:12px;">Login Required</h3>
                        <p style="color:var(--text-muted);margin-bottom:24px;">Please log in to view your order history.</p>
                        <a href="index.html" class="btn-primary">
                            <i data-lucide="log-in"></i> Go to Home & Login
                        </a>
                    </div>
                </div>

                <!-- Loading -->
                <div id="orders-loading" style="text-align:center; padding:60px; color:var(--text-muted);">
                    <i data-lucide="loader" style="width:36px;height:36px;margin-bottom:16px;animation:spin 1s linear infinite;"></i>
                    <p>Loading your orders...</p>
                </div>

                <!-- Orders -->
                <div id="orders-list-container" style="display:none;">
                    <div class="orders-list" id="orders-list"></div>
                </div>

            </div>
        </section>
    </main>



    <script src="js/config.js"></script>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>

    <script>
        lucide.createIcons();
        document.getElementById('year')?.remove(); // Removed year since footer is gone

        // Theme
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('theme-icon');
            if (icon) icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
            lucide.createIcons();
            document.getElementById('theme-toggle').addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                document.getElementById('theme-icon').setAttribute('data-lucide', next === 'dark' ? 'sun' : 'moon');
                lucide.createIcons();
            });
        })();

        // Mobile Menu
        const hamburger  = document.getElementById('hamburger');
        const navLinks   = document.getElementById('nav-links');
        const navOverlay = document.getElementById('nav-overlay');
        function openNav()  { navLinks.classList.add('active');    navOverlay.classList.add('active'); }
        function closeNav() { navLinks.classList.remove('active'); navOverlay.classList.remove('active'); }
        if (hamburger)  hamburger.addEventListener('click',  () => navLinks.classList.contains('active') ? closeNav() : openNav());
        if (navOverlay) navOverlay.addEventListener('click', closeNav);
        document.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', closeNav));

        // Navbar scroll
        window.addEventListener('scroll', () => {
            document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
        });

        // Nav badges


        // ── Orders Logic (FIX BUG-10: cleaner auth state handling) ──────────────
        let ordersState = 'waiting'; // 'waiting' | 'loading' | 'loaded' | 'no-auth'

        function showLoading()    { document.getElementById('orders-loading').style.display = 'block';   document.getElementById('orders-login-prompt').style.display = 'none'; document.getElementById('orders-list-container').style.display = 'none'; }
        function showLoginPrompt(){ document.getElementById('orders-loading').style.display = 'none';    document.getElementById('orders-login-prompt').style.display = 'block'; document.getElementById('orders-list-container').style.display = 'none'; lucide.createIcons(); }
        function showOrdersList() { document.getElementById('orders-loading').style.display = 'none';    document.getElementById('orders-login-prompt').style.display = 'none'; document.getElementById('orders-list-container').style.display = 'block'; }

        // Auth state change listener (fires when auth module loads)
        window.addEventListener('auth-state-changed', async (e) => {
            if (ordersState === 'loaded') return; // Already loaded
            const user = e.detail.user;
            if (!user) {
                ordersState = 'no-auth';
                showLoginPrompt();
                return;
            }
            ordersState = 'loading';
            showLoading();
            await loadOrders(user.uid);
        });

        // FIX BUG-10: Timeout fallback — show appropriate state after 6 seconds
        // But check _currentUser first in case auth already resolved
        setTimeout(() => {
            if (ordersState === 'waiting') {
                // Auth module hasn't fired yet — check window._currentUser
                if (window._currentUser) {
                    ordersState = 'loading';
                    loadOrders(window._currentUser.uid);
                } else {
                    ordersState = 'no-auth';
                    showLoginPrompt();
                }
            }
        }, 4000);

        async function loadOrders(userId) {
            try {
                const { collection, query, where, orderBy, getDocs } =
                    await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");

                // Wait for db
                let db = window._firebaseDb;
                let attempts = 0;
                while (!db && attempts < 20) {
                    await new Promise(r => setTimeout(r, 300));
                    db = window._firebaseDb;
                    attempts++;
                }

                if (!db) throw new Error('Firestore not initialized.');

                let snapshot;
                try {
                    const q = query(
                        collection(db, 'orders'),
                        where('userId', '==', userId),
                        orderBy('createdAt', 'desc')
                    );
                    snapshot = await getDocs(q);
                } catch (indexErr) {
                    // If orderBy fails (missing index), fetch without sort
                    console.warn('Orders query fallback (no index):', indexErr.message);
                    const q2 = query(collection(db, 'orders'), where('userId', '==', userId));
                    snapshot = await getDocs(q2);
                }

                ordersState = 'loaded';

                if (snapshot.empty) {
                    showOrdersList();
                    document.getElementById('orders-list').innerHTML = `
                        <div class="empty-state">
                            <i data-lucide="package" style="width:64px;height:64px;color:var(--text-muted);margin-bottom:24px;opacity:0.4;"></i>
                            <h3>No orders yet</h3>
                            <p>You haven't placed any orders yet.</p>
                            <a href="index.html#products" class="btn-primary" style="margin-top:8px;">
                                <i data-lucide="shopping-bag"></i> Shop Now
                            </a>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                const orders = [];
                snapshot.forEach(d => orders.push({ id: d.id, ...d.data() }));

                // Sort client-side if needed
                orders.sort((a, b) => {
                    const ta = a.createdAt?.toDate?.() || 0;
                    const tb = b.createdAt?.toDate?.() || 0;
                    return tb - ta;
                });

                renderOrders(orders);
                showOrdersList();

            } catch (err) {
                console.error('Error loading orders:', err);
                ordersState = 'loaded';
                document.getElementById('orders-loading').innerHTML = `
                    <div style="text-align:center;color:var(--text-muted);padding:40px;">
                        <i data-lucide="alert-circle" style="width:48px;height:48px;margin-bottom:16px;opacity:0.5;"></i>
                        <p>Unable to load orders. Please try refreshing.</p>
                        <button onclick="location.reload()" class="btn-outline" style="margin-top:16px;">Refresh Page</button>
                    </div>`;
                lucide.createIcons();
            }
        }

        function formatDate(ts) {
            if (!ts) return 'Date unavailable';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
        }

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            list.innerHTML = orders.map(order => {
                const status = (order.orderStatus || order.status || 'Confirmed');
                const statusClass = `status-${status.toLowerCase().replace(/\s+/g, '-')}`;

                const items = order.products || order.items || [];
                const itemsHtml = items.length > 0
                    ? items.map(item => `
                        <div class="order-line-item" style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <img src="${item.image || ''}" style="width:40px;height:40px;border-radius:4px;object-fit:cover;" onerror="this.style.display='none'">
                                <span>${item.name} <span style="color:var(--text-muted);font-size:0.85rem;">×${item.quantity || 1}</span></span>
                            </div>
                            <span style="font-weight:600;">₹${(Number(item.price || 0) * Number(item.quantity || 1)).toFixed(2)}</span>
                        </div>`).join('')
                    : '<p style="color:var(--text-muted);font-size:0.9rem;">No item details</p>';

                const addr = order.address;
                const addrText = addr
                    ? [addr.line1, addr.line2, addr.city, addr.state, addr.pincode].filter(Boolean).join(', ')
                    : 'No address recorded';

                // Timeline logic
                const stages = ['Confirmed', 'Order Packed', 'Ready to Ship', 'In Transit', 'Near Your City', 'Delivered', 'Cancelled'];
                const currentIndex = stages.indexOf(status);
                
                let timelineHtml = '<div style="display:flex; flex-direction:column; gap:8px; margin: 20px 0; padding:16px; background:var(--bg-main); border-radius:12px;">';
                if(status === 'Cancelled') {
                    timelineHtml += `<div style="color:#ef4444; font-weight:600;"><i data-lucide="x-circle" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:6px;"></i> Order Cancelled</div>`;
                } else {
                    stages.slice(0,6).forEach((stage, idx) => {
                        let icon = 'circle';
                        let color = 'var(--text-muted)';
                        let weight = '400';
                        if (idx < currentIndex) { icon = 'check-circle'; color = '#22c55e'; weight='500'; }
                        else if (idx === currentIndex) { icon = 'disc'; color = 'var(--primary)'; weight='700'; }
                        
                        timelineHtml += `
                            <div style="display:flex; align-items:center; gap:10px; color:${color}; font-weight:${weight};">
                                <i data-lucide="${icon}" style="width:16px;height:16px;"></i>
                                ${stage}
                            </div>
                        `;
                    });
                }
                timelineHtml += '</div>';

                return `
                    <div class="order-card fade-up">
                        <div class="order-card-header">
                            <div>
                                <div class="order-card-id">#${order.id.substring(0, 12).toUpperCase()}</div>
                                <div class="order-card-date">📅 ${formatDate(order.createdAt)}</div>
                            </div>
                            <span class="order-status-badge ${statusClass}">${status}</span>
                        </div>
                        
                        ${timelineHtml}
                        
                        <div class="order-items-list" style="margin-bottom:16px;">${itemsHtml}</div>
                        
                        <div style="border-top:1px dashed var(--border); padding-top:12px; margin-bottom:12px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:4px; color:var(--text-muted);">
                                <span>Subtotal</span><span>₹${Number(order.subtotal || 0).toFixed(2)}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:4px; color:var(--text-muted);">
                                <span>Delivery Charge</span><span>₹${Number(order.deliveryCharge || 0).toFixed(2)}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:12px; color:var(--text-muted);">
                                <span>COD Charge</span><span>₹${Number(order.codCharge || 0).toFixed(2)}</span>
                            </div>
                            <div class="order-total-row" style="border-top:none; padding-top:0;">
                                <span>Final Total</span>
                                <span style="color:var(--primary); font-size:1.2rem;">₹${Number(order.totalAmount || order.total || 0).toFixed(2)}</span>
                            </div>
                        </div>

                        <div class="order-address" style="background:var(--bg-main); padding:12px; border-radius:8px; font-size:0.85rem; line-height:1.5;">
                            📦 <strong>Delivery:</strong> ${addrText}<br>
                            💳 <strong>Payment:</strong> ${(order.paymentMethod || 'COD').toUpperCase()} &middot; <strong style="color:${(order.paymentStatus||'Pending')==='Paid'?'#22c55e':'#ef4444'}">${order.paymentStatus || 'Pending'}</strong>
                        </div>
                    </div>`;
            }).join('');

            lucide.createIcons();

            // Animate cards
            const obs = new IntersectionObserver(entries => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
            }, { threshold: 0.1 });
            document.querySelectorAll('.order-card.fade-up').forEach(el => obs.observe(el));
        }
    </script>


</body>
</html>
